<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoPadel PKP - Linktree / Digital Card</title>
    <!-- Font Awesome untuk Icon Social Media & Whatsapp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-gopadel: #B08B4B; /* Warna Emas/Bronze GoPadel */
            --color-kbl: #008D43;     /* Warna Hijau KBL */
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 35px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px var(--shadow-color);
            text-align: center;
            overflow: hidden;
            z-index: 1;
        }

        /* Watermark Background Logo KBL */
        .container::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background-image: url('kbl.png'); /* Mengambil file gambar KBL */
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.10; /* Efek Transparan Watermark */
            z-index: -1;
            pointer-events: none;
        }

        /* Header & Logo GoPadel */
        .header {
            margin-bottom: 25px;
        }

        .logo-gopadel {
            width: 130px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .header h1 {
            font-size: 22px;
            color: var(--color-gopadel);
            margin-top: 5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 12px;
            color: #555;
            margin-top: 8px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .btn i {
            font-size: 18px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        }

        /* Style Tombol khusus */
        .btn-wa-reservation {
            background-color: #25D366;
            color: #ffffff;
        }

        .btn-save-contact {
            background-color: var(--color-gopadel);
            color: #ffffff;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
        }

        .btn-youtube {
            background-color: #FF0000;
            color: #ffffff;
        }

        /* Skip 1 Kotak / Space Jarak */
        .spacer {
            height: 25px;
        }

        .btn-feedback {
            background-color: #333333;
            color: #ffffff;
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header dengan Logo GoPadel (.jpg) -->
        <div class="header">
            <img src="gopadel.jpg" alt="Logo GoPadel" class="logo-gopadel">
            <h1>GoPadel PKP</h1>
            <p>Papinka Valley, Jl. Depati Hamzah No.999, Semabung Lama, Kec. Bukitintan, Kota Pangkal Pinang, Kepulauan Bangka Belitung 33148</p>
        </div>

        <!-- Group Tombol Utama -->
        <div class="links-group">
            <!-- 1. WhatsApp Reservation -->
            <a href="https://wa.me/6283182008195?text=Halo%20GoPadel,%20saya%20ingin%20melakukan%20reservasi." target="_blank" class="btn btn-wa-reservation">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp (For Reservation)
            </a>

            <!-- Save Contact -->
            <a href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AFN%3AGoPadel%20PKP%20Reservation%0ATEL%3BTYPE%3DCELL%3A%2B6283182008195%0AEND%3AVCARD" download="GoPadel_Reservation.vcf" class="btn btn-save-contact">
                <i class="fa-solid fa-address-book"></i> Save Contact
            </a>

            <!-- 2. Instagram -->
            <a href="https://www.instagram.com/gopadelpkp?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>

            <!-- 3. Youtube -->
            <a href="https://youtube.com/@gopadelpkp?si=No91XKJK5gEuA340" target="_blank" class="btn btn-youtube">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>

            <!-- Skip 1 Kotak / Space -->
            <div class="spacer"></div>

            <!-- Bagian Bawah: Kritik & Saran -->
            <a href="https://wa.me/6281911592800?text=Halo%20GoPadel,%20saya%20ingin%20menyampaikan%20kritik/saran." target="_blank" class="btn btn-feedback">
                <i class="fa-brands fa-whatsapp"></i> Kritik & Saran (+62 819-1159-2800)
            </a>
        </div>

        <div class="footer">
            &copy; GoPadel PKP. All rights reserved.
        </div>
    </div>

</body>
</html>
